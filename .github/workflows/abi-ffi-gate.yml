# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# abi-ffi-gate.yml — enforce that the Zig FFI conforms to the Idris2 ABI.
#
# The Idris2 ABI (src/interface/abi) is the source of truth. This gate fails if
# the Zig FFI (src/interface/ffi) drifts from it: a declared C function with no
# export, a mismatched result-code map, or an unrendered template token. A
# second job builds + tests the Zig FFI under the pinned Zig 0.14.0. The
# idris2-check job type-checks the root ABI and every satellite ABI
# (satellites/*/src/interface/abi) with totality enforced.
name: ABI-FFI Gate

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  conformance:
    name: ABI ↔ FFI structural conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Julia 1.11.5
        run: |
          curl -fsSL https://julialang-s3.julialang.org/bin/linux/x64/1.11/julia-1.11.5-linux-x86_64.tar.gz -o /tmp/julia.tar.gz
          tar -xf /tmp/julia.tar.gz -C /tmp
          echo "/tmp/julia-1.11.5/bin" >> "$GITHUB_PATH"
      - name: Run ABI-FFI gate
        run: |
          julia --version   # confirms the pinned 1.11.5 is on PATH, not the runner default
          julia scripts/abi-ffi-gate.jl

  zig-build:
    name: Zig FFI builds + tests (Zig 0.14.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Zig 0.14.0
        run: |
          curl -fsSL https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      - name: zig test FFI
        run: zig test src/interface/ffi/src/main.zig -lc

  idris2-check:
    name: Idris2 ABI type-check (Idris2 0.8.0, total)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Idris2 0.8.0 from the pinned upstream commit
        env:
          # Exact commit referenced by the upstream v0.8.0 tag.
          IDRIS2_REVISION: 15a3e4e70843f7a34100f6470c04b791330788df
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y chezscheme make libgmp-dev
          git clone --filter=blob:none --no-checkout \
            https://github.com/idris-lang/Idris2.git /tmp/idris2
          git -C /tmp/idris2 checkout --detach "$IDRIS2_REVISION"
          make -C /tmp/idris2 bootstrap SCHEME=scheme
          make -C /tmp/idris2 install PREFIX="$HOME/.idris2"
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
      - name: Every ABI module is listed in its package
        run: |
          set -euo pipefail
          # Covers the root ABI and every satellite ABI. GitHub runs only the
          # root workflows, so the satellites' own gates never run here.
          # A module missing from its .ipkg is never type-checked.
          fail=0
          for dir in src/interface/abi satellites/*/src/interface/abi; do
            ipkg=$(find "$dir" -maxdepth 1 -name '*.ipkg' | head -n 1)
            [ -n "$ipkg" ] || { echo "::error::no .ipkg in $dir"; fail=1; continue; }
            files=$(cd "$dir" && find . -name '*.idr' -not -path './build/*' \
              | sed 's|^\./||; s|\.idr$||; s|/|.|g' | sort)
            # Comments are dropped first: a module named only after -- is not built.
            listed=$(sed -n '/^modules/,/^[a-z]/p' "$ipkg" \
              | sed 's/--.*$//' \
              | grep -oE '[A-Z][A-Za-z0-9_.]+' | sort -u)
            missing=$(comm -23 <(echo "$files") <(echo "$listed"))
            if [ -n "$missing" ]; then
              echo "::error::Idris2 modules not listed in $ipkg: $missing"
              fail=1
            fi
          done
          exit "$fail"
      - name: No holes or escape hatches in the ABI proofs
        run: |
          set -euo pipefail
          # Idris2 accepts a ?hole and these escape hatches even under
          # --total, so a green type-check alone would not show the proofs
          # are complete.
          # Idris2 honours a partial or covering modifier after any other
          # modifier (export, %inline, ...) or alone on its line, so any use of
          # either word on a code line fails. A hole name may start with
          # either case (?Foo). Whole-line -- and ||| comments are skipped; a
          # trailing or block comment or a string naming either word fails
          # too, so reword it.
          pattern='(^|[^A-Za-z0-9_'"'"'])\?[A-Za-z_]|believe_me|assert_total|assert_smaller|idris_crash|(^|[^A-Za-z0-9_'"'"'.])(partial|covering)([^A-Za-z0-9_'"'"']|$)'
          hits=$(find src/interface/abi satellites/*/src/interface/abi \
              -name '*.idr' -not -path '*/build/*' -print0 \
            | xargs -0 grep -nE "$pattern" \
            | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(--|\|\|\|)' || true)
          if [ -n "$hits" ]; then
            echo "::error::Holes or escape hatches in the ABI proofs:"
            echo "$hits"
            exit 1
          fi
      - name: Type-check with totality enforced
        run: |
          set -euo pipefail
          idris2 --version
          # Totality comes from opts in each .ipkg. Given --total on the
          # command line, Idris2 0.8.0 prints an options error, checks
          # nothing and exits 0.
          # The flag must sit inside the quoted value: opts = "" -- --total sets
          # no options, because the text after the quote is a comment. The
          # package must have exactly one opts/options line: a later one
          # replaces the earlier, so opts = "--total" then options = "" sets
          # no options either.
          fail=0
          for dir in src/interface/abi satellites/*/src/interface/abi; do
            ipkg=$(basename "$(find "$dir" -maxdepth 1 -name '*.ipkg' | head -n 1)")
            decls=$(grep -cE '^[[:space:]]*(opts|options)[[:space:]]*=' "$dir/$ipkg" || true)
            if [ "$decls" != 1 ] \
              || ! grep -Eq '^[[:space:]]*(opts|options)[[:space:]]*=[[:space:]]*"[^"]*--total[^"]*"' "$dir/$ipkg"; then
              echo "::error::$dir/$ipkg must have exactly one opts line, set to opts = \"--total\""
              fail=1
              continue
            fi
            echo "::group::$dir/$ipkg"
            (cd "$dir" && idris2 --typecheck "$ipkg") || fail=1
            echo "::endgroup::"
          done
          exit "$fail"
