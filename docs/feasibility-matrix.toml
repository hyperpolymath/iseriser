#
# feasibility-matrix.toml — machine-readable form of docs/FEASIBILITY.adoc
#
# THE REGULARITY RULE (docs/FEASIBILITY.adoc §6-7):
#   An -iser's README may claim only what its seam-class carries, and only
#   what its evidence-tier machine-checks. Claims above these labels are
#   README debt.
#
# seam_class:
#   injector  = structural guarantee provably crosses the C ABI
#   service   = compiled island in the specialist language; effects (not
#               guarantees) reach the host; boundary obligations stated
#   scaffolder= generated boilerplate/wiring; no cross-seam guarantee
#
# evidence_tier:
#   t0 = honest (claims ≤ CI checks; "scaffold" if codegen stubbed)
#   t1 = sealed (FFI contract published; abi-verify drift gate green)
#   t2 = end-to-end (real target toolchain compiles+runs generated code in CI)
#   t3 = value-demonstrated (benchmark vs host-only baseline)
#
# language_level (estate languages only; external languages are "external"):
#   l0 = named/spec   l1 = implemented+tested   l2 = ABI-stable+golden
#   l3 = consumed outside the estate
#
# assessed: 2026-09-25. method: "inspected" = code/CI read directly;
# "survey" = assessed from repo size, ATLAS note, and manifest surface.

version = 1
assessed = "2026-09-25"
source_doc = "docs/FEASIBILITY.adoc"

[[iser]]
