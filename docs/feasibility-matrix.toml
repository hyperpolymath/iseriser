language = "Chapel"
language_origin = "external"
seam_class = "service"
evidence_tier = "t2"
method = "inspected"
note = "Flagship. Provable lane green on main: idris2 --check, zig build test, golden codegen, generated Chapel compiled AND run via chpl. Multilocale >=2 nodes is the open deployment frontier."

